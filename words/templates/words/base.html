<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>My English Learning App</title>

    <!-- Тема применяется до отрисовки страницы, чтобы не было мигания -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (!theme) {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();

        function toggleTheme() {
            var root = document.documentElement;
            var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-bs-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Шрифты загружаются в фоне: если Google Fonts недоступен, страница всё равно откроется -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">

    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --soft: #eceef2;
            --ink: #1a1d23;
            --muted: #667085;
            --line: #e0e3e9;
            --accent: #2f4f7f;
            --accent-ink: #ffffff;
            --danger: #93302c;
            --serif: "Source Serif 4", "PT Serif", Georgia, "Times New Roman", serif;
            --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color-scheme: light;
        }
        [data-bs-theme="dark"] {
            --bg: #14171c;
            --surface: #1a1e25;
            --soft: #222730;
            --ink: #e8eaee;
            --muted: #98a0ae;
            --line: #2a2f39;
            --accent: #8fb0e0;
            --accent-ink: #14171c;
            --danger: #e0716b;
            color-scheme: dark;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Совместимость с остальными страницами (тренировка, вход, регистрация) */
        .bg-white, .card { background-color: var(--surface) !important; color: var(--ink); }
        .bg-light { background-color: var(--soft) !important; }
        .text-dark { color: var(--ink) !important; }
        .text-secondary, .text-muted { color: var(--muted) !important; }
        .border, .card { border-color: var(--line) !important; }
        .form-control, .form-select {
            background-color: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--surface);
            color: var(--ink);
            border-color: var(--accent);
            box-shadow: none;
        }
        .form-control::placeholder { color: var(--muted); opacity: .8; }
        .btn-primary, .btn-success {
            --bs-btn-bg: var(--accent);
            --bs-btn-border-color: var(--accent);
            --bs-btn-color: var(--accent-ink);
            --bs-btn-hover-bg: var(--accent);
            --bs-btn-hover-border-color: var(--accent);
            --bs-btn-hover-color: var(--accent-ink);
            --bs-btn-active-bg: var(--accent);
            --bs-btn-active-border-color: var(--accent);
            --bs-btn-active-color: var(--accent-ink);
            border-radius: 6px;
        }
        .btn-primary:hover, .btn-success:hover { filter: brightness(1.08); }
        .alert {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
        }
        .alert-danger { border-left-color: var(--danger); }
        .alert-warning { border-left-color: #b8892f; }

        /* Макет */
        .shell { max-width: 760px; margin: 0 auto; padding: 0 1.25rem; }
        .topbar { border-bottom: 1px solid var(--line); background: var(--bg); }
        .topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .brand { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; color: var(--ink); text-decoration: none; }
        .topbar-actions { display: flex; align-items: center; gap: .25rem; }
        .user-name { color: var(--muted); font-size: .9rem; margin-right: .5rem; }
        .quiet-btn {
            background: none; border: 0; color: var(--muted);
            padding: .4rem .6rem; border-radius: 6px; font-size: .9rem; line-height: 1;
        }
        .quiet-btn:hover { color: var(--ink); background: var(--soft); }
        .quiet-btn.danger:hover { color: var(--danger); }
        .theme-sun { display: none; }
        [data-bs-theme="dark"] .theme-sun { display: inline; }
        [data-bs-theme="dark"] .theme-moon { display: none; }

        .tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--line); margin-top: 2rem; overflow-x: auto; }
        .tab {
            padding: .6rem 0; color: var(--muted); text-decoration: none; white-space: nowrap;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
        }
        .tab:hover { color: var(--ink); }
        .tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

        .add-form { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.75rem; }
        .add-form .form-control { flex: 1 1 12rem; min-width: 0; padding: .6rem .8rem; }
        .add-form .form-select { flex: 0 0 auto; width: auto; padding: .6rem 2rem .6rem .8rem; }
        .btn-accent {
            background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
            border-radius: 6px; padding: .6rem 1.1rem; font-weight: 500; text-decoration: none; display: inline-block;
        }
        .btn-accent:hover { filter: brightness(1.08); color: var(--accent-ink); }
        .btn-line {
            background: transparent; color: var(--ink); border: 1px solid var(--line);
            border-radius: 6px; padding: .4rem .9rem; text-decoration: none; font-size: .9rem; display: inline-block;
        }
        .btn-line:hover { border-color: var(--accent); color: var(--accent); }

        .summary-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1.5rem; color: var(--muted); font-size: .92rem; }

        .category { margin-top: 2.5rem; }
        .category-title { font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 .5rem; }

        .entry { padding: 1.1rem 0; border-top: 1px solid var(--line); }
        .entry-main {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: .25rem 1.5rem; align-items: baseline;
        }
        .headword { font-family: var(--serif); font-size: 1.5rem; line-height: 1.2; font-weight: 600; margin: 0; }
        .ipa { color: var(--muted); font-size: .9rem; margin-left: .5rem; font-weight: 400; font-family: var(--sans); }
        .tag {
            border: 1px solid var(--line); border-radius: 4px; font-size: .72rem; font-family: var(--sans);
            font-weight: 400; padding: .05rem .4rem; color: var(--muted); margin-left: .5rem; vertical-align: middle;
        }
        .translation { color: var(--ink); }
        .example {
            margin: .7rem 0 0; padding-left: .9rem; border-left: 2px solid var(--line);
            color: var(--muted); font-size: .92rem; font-style: italic;
        }
        .my-examples { list-style: none; padding: 0; margin: .6rem 0 0; font-size: .92rem; }
        .my-examples li { padding: .15rem 0; }
        .entry-tools { display: flex; align-items: center; gap: 1rem; margin-top: .6rem; font-size: .88rem; }
        .entry-tools .spacer { margin-left: auto; }
        .entry-tools form { margin: 0; }
        .add-example summary { cursor: pointer; list-style: none; color: var(--accent); }
        .add-example summary::-webkit-details-marker { display: none; }
        .add-example[open] summary { color: var(--muted); }
        .add-example form { margin-top: .5rem; }
        .icon-btn { background: none; border: 0; color: var(--muted); padding: .15rem .3rem; border-radius: 4px; }
        .icon-btn:hover { color: var(--ink); }
        .icon-btn.danger:hover { color: var(--danger); }
        .empty { color: var(--muted); padding: 2rem 0; }

        @media (max-width: 575.98px) {
            .entry-main { grid-template-columns: 1fr; }
            .user-name { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
