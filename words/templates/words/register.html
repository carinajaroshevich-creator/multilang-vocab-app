{% extends 'words/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h2 class="text-center mb-4">Регистрация в приложении</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100 mt-3">Создать аккаунт</button>
        </form>
        <p class="text-center mt-3 text-muted">
            Уже есть аккаунт? <a href="{% url 'login' %}" class="text-dark">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
